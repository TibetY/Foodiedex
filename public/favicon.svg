<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The Kanpai mark: three overlapping dots in the same arrangement as the
       in-app <Logo>. The dots take each theme's mid-tone accent (matcha,
       sakura, peach) rather than the Logo's pale decorative fills, which
       vanish against the paper tile at 16px. -->
  <rect width="32" height="32" rx="8" fill="#FDFBF7"/>
  <circle cx="13.5" cy="17.9" r="10.5" fill="#5B6E48"/>
  <circle cx="21.6" cy="11.1" r="7.4" fill="#D68484"/>
  <circle cx="24" cy="23.4" r="5" fill="#D9A273"/>
</svg>
